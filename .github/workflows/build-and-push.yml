name: Build and test AMCUI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm test
      - run: npm run test:web
        env:
          AMCUI_DISABLE_SENTRY: 'true'
  integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p amcui-mcp-test -f compose.mcp-test.yml up --build --abort-on-container-exit --exit-code-from smoke
      - if: always()
        run: docker compose -p amcui-mcp-test -f compose.mcp-test.yml down -v
  images:
    if: github.event_name == 'push'
    needs: [test, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: amcui-grademanager
            dockerfile: apps/web/Dockerfile
            context: .
          - image: amcui-server
            dockerfile: apps/server/Dockerfile
            context: .
          - image: amcui-svg2pdf
            dockerfile: apps/server/svg2pdf/Dockerfile
            context: apps/server/svg2pdf
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/bfritscher/${{ matrix.image }}:latest,ghcr.io/bfritscher/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VITE_COMMITHASH=${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}
