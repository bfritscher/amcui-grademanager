services:
  redis:
    image: redis
    volumes:
      - ./data:/data
    ports:
      - "6379:6379"
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    environment:
    - REDIS_HOSTS=local:redis:6379
    - CLIENT_MAX_BODY_SIZE=100mb
    depends_on:
      - redis
    ports:
    - "8081:8081"
  amcuiserver:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    env_file: .env
    command: npm run dev --workspace=amcui-server
    working_dir: /amc
    volumes:
      - ./data/db:/data/db
      - ./src:/amc/apps/server/src
      - ../../packages/exam-core:/amc/packages/exam-core
      - ./projects:/amc/projects
      - ./templates:/amc/templates
      - ./coverage:/amc/coverage
    ports:
      - "8181:8181"
      - "5858:5858"
      - "9001:9001"
    depends_on:
      - redis
      - svg2pdf
  svg2pdf:
    build: ./svg2pdf
    cap_add:
      - SYS_ADMIN
    ports:
      - "3000:3000"
