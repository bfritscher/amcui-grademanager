services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  redis:
    image: redis
    volumes:
      - ./data:/data
    ports:
      - "6379:6379"
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    environment:
    - REDIS_HOSTS=local:redis:6379
    - CLIENT_MAX_BODY_SIZE=100mb
    depends_on:
      - redis
    ports:
    - "8081:8081"
  amcuiserver:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      AMCUI_SMTP_HOST: mailpit
      AMCUI_SMTP_PORT: "1025"
      AMCUI_SMTP_SECURE: "false"
      AMCUI_SMTP_REQUIRE_TLS: "false"
      AMCUI_SMTP_USER: ""
      AMCUI_SMTP_PASSWORD: ""
      AMCUI_MAIL_FROM: "AMCUI TEST <amcui@example.org>"
      AMCUI_WEB_URL: "http://localhost:5173"
    command: npm run dev --workspace=amcui-server
    working_dir: /amc
    volumes:
      - ./data/db:/data/db
      - ./src:/amc/apps/server/src
      - ../../packages/exam-core:/amc/packages/exam-core
      - ./projects:/amc/projects
      - ./templates:/amc/templates
      - ./coverage:/amc/coverage
    ports:
      - "8181:8181"
      - "5858:5858"
      - "9001:9001"
    depends_on:
      - redis
      - svg2pdf
      - mailpit
  svg2pdf:
    build: ./svg2pdf
    cap_add:
      - SYS_ADMIN
    ports:
      - "3000:3000"
