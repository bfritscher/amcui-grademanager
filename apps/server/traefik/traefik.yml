entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ':443'
    transport:
      respondingTimeouts:
        readTimeout: 5m

providers:
  file:
    filename: '/conf.yml'
  docker:
    exposedByDefault: false

certificatesResolvers:
  myresolver:
    acme:
      email: your-email@example.com
      storage: /acme.json
      httpChallenge:
        # used during the challenge
        entryPoint: web
